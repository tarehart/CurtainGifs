<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kinetic Text - GIF maker for tiny displays</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0e0e12; color:#e8e8ee; font:13px system-ui, sans-serif; }
  .kt { display:grid; grid-template-columns: 300px 1fr; gap:14px; padding:14px; min-height:100dvh; box-sizing:border-box; }
  .kt aside { display:flex; flex-direction:column; gap:6px; max-height:calc(100dvh - 28px); overflow-y:auto; padding-right:6px; }
  .kt h3 { margin:12px 0 2px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.55; }
  .kt label { display:flex; justify-content:space-between; align-items:center; font-size:12px; opacity:.85; margin-top:4px; gap:6px; }
  .kt input, .kt select, .kt textarea, .kt button { font:inherit; color:inherit; background:#1a1a22; border:1px solid #33333f; border-radius:6px; padding:5px 7px; width:100%; box-sizing:border-box; }
  .kt input[type=color] { height:30px; padding:2px; }
  .kt input[type=range] { background:transparent; border:none; padding:0; }
  .kt input[type=checkbox] { width:auto; }
  .kt input[type=file] { padding:4px; font-size:11px; }
  .kt .row { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .kt .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .kt button { cursor:pointer; }
  .kt button.primary { background:#4f2bd6; border-color:#5f3be6; }
  .kt button:hover { border-color:#6a6a7a; }
  .kt .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .kt .hidden { display:none !important; }
  #stage { border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; min-height:420px; }
  #txt { white-space:pre-wrap; word-break:break-word; line-height:1.15; text-align:center; }
  #txt .ch, #txt img { display:inline-block; opacity:0; }
  .stageWrap { display:flex; flex-direction:column; gap:10px; }
  .steps { display:flex; flex-direction:column; gap:5px; }
  .step { display:grid; grid-template-columns:auto 1fr auto; gap:6px; align-items:center; background:#16161d; border:1px solid #2a2a34; border-radius:7px; padding:6px; }
  .step .tag { font-size:10px; padding:2px 5px; border-radius:4px; background:#33333f; }
  .step .tag.img { background:#2b5; color:#041; }
  .step .mini { font-size:11px; opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .step .sctl { display:flex; gap:3px; }
  .step .sctl button { width:26px; padding:3px; }
  .out { font-size:11px; opacity:.75; white-space:pre-wrap; background:#16161d; border:1px solid #2a2a34; border-radius:7px; padding:8px; min-height:18px; }
  .bar { height:8px; background:#1a1a22; border-radius:4px; overflow:hidden; border:1px solid #2a2a34; }
  .bar > div { height:100%; width:0; background:#4f2bd6; transition:width .1s; }
  .dimPrevWrap { background:#16161d; border:1px solid #2a2a34; border-radius:8px; padding:10px; }
  .dimPrevLabel { font-size:11px; opacity:.7; margin-bottom:8px; }
  #dimInfo { opacity:1; color:#9f8bff; }
  #dimFrame { display:flex; align-items:center; justify-content:center; background:#000; border-radius:4px; padding:10px; overflow:auto; max-width:100%; }
  /* checkerboard so the frame edge is visible against any bg color */
  #dimCanvas { image-rendering:pixelated; outline:1px solid #444; display:block; }
  .zoomRow { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:11px; opacity:.8; }
  .zoomRow input { flex:1; }
  @keyframes k-fade { from{opacity:0} to{opacity:1} }
  @keyframes k-rise { from{opacity:0; transform:translateY(.6em)} to{opacity:1; transform:none} }
  @keyframes k-drop { 0%{opacity:0; transform:translateY(-1.2em)} 60%{opacity:1; transform:translateY(.1em)} 100%{opacity:1; transform:none} }
  @keyframes k-pop { 0%{opacity:0; transform:scale(0)} 70%{opacity:1; transform:scale(1.25)} 100%{opacity:1; transform:scale(1)} }
  @keyframes k-blur { from{opacity:0; filter:blur(12px); transform:scale(1.4)} to{opacity:1; filter:none; transform:none} }
  @keyframes k-spin { from{opacity:0; transform:rotate(-180deg) scale(.3)} to{opacity:1; transform:none} }
  @keyframes k-flip { from{opacity:0; transform:perspective(400px) rotateX(90deg)} to{opacity:1; transform:none} }
  @keyframes k-splash {
    0%   { opacity:0; transform:translateY(-1em) scale(0) rotate(-112deg); }
    55%  { opacity:1; transform:translateY(.05em) scale(1.35) rotate(6deg); }
    75%  { transform:translateY(0) scale(.9) rotate(-3deg); }
    100% { opacity:1; transform:none; }
  }
  @media (max-width:760px){
    /* stack to one column; let the whole page scroll instead of trapping the
       controls in a short scroll box above the stage */
    .kt { grid-template-columns:1fr; padding:12px; padding-bottom:max(12px, env(safe-area-inset-bottom)); gap:12px; }
    .kt aside { max-height:none; overflow:visible; padding-right:0; order:2; }
    .stageWrap { order:1; }                 /* show the preview first on phones */
    body { font-size:15px; }                 /* bigger base text */
    .kt input, .kt select, .kt button { padding:9px 10px; font-size:15px; } /* fat tap targets */
    .kt input[type=range] { height:28px; }   /* easier to drag */
    .kt input[type=color] { height:40px; }
    .kt label { font-size:13px; }
    #stage { min-height:46vh; }               /* roomy but leaves controls reachable */
    .step .sctl button { width:34px; padding:7px 4px; }   /* bigger move/remove taps */
    .dimPrevWrap { position:sticky; top:0; z-index:5; }    /* keep the size preview in view */
  }
  @media (max-width:420px){
    .kt .row3 { grid-template-columns:1fr 1fr; } /* 3-up controls wrap on tiny screens */
  }
</style>
</head>
<body>
<div class="kt">
  <aside aria-label="Settings">
    <h3>Sequence</h3>
    <div class="steps" id="steps"></div>
    <div class="row3">
      <button id="addText">+ Text</button>
      <button id="addImg">+ Image</button>
      <button id="addLogo">+ Logo</button>
    </div>
    <div class="row"><button id="addGif">+ GIF (append clip)</button></div>
    <input id="imgFile" type="file" accept="image/*,.svg" class="hidden">
    <input id="gifFile" type="file" accept="image/gif" class="hidden">

    <h3>Letters</h3>
    <label for="mode">Reveal mode</label>
    <select id="mode">
      <option value="build">Build up (letters stay)</option>
      <option value="single" selected>One at a time (replace)</option>
      <option value="slide">Two at a time (slide left)</option>
    </select>
    <label for="font">Font</label>
    <select id="font">
      <option value="system-ui, sans-serif">Sans</option>
      <option value="Georgia, serif">Serif</option>
      <option value="'Courier New', monospace">Mono</option>
      <option value="Impact, 'Arial Black', sans-serif">Impact</option>
      <option value="'Brush Script MT', cursive">Script</option>
      <option value="custom">Custom...</option>
    </select>
    <input id="fontC" class="hidden" type="text" placeholder="'Fira Code', monospace" aria-label="Custom font">
    <label for="size">Size <span id="vsize"></span></label><input id="size" type="range" min="8" max="200" value="64">
    <div class="row">
      <div><label for="wt">Weight</label><select id="wt"><option>300</option><option>400</option><option>600</option><option selected>800</option><option>900</option></select></div>
      <div><label for="fg">Text color</label><input id="fg" type="color" value="#ffffff"></div>
    </div>
    <div class="row">
      <div><label for="stw">Stroke <span id="vstw"></span></label><input id="stw" type="range" min="0" max="30" value="0"></div>
      <div><label for="stc">Stroke color</label><input id="stc" type="color" value="#000000"></div>
    </div>
    <label for="fx">Enter effect</label>
    <select id="fx"><option value="splash">Splash (drop+pop+twist)</option><option>fade</option><option selected>rise</option><option>drop</option><option>pop</option><option>blur</option><option>spin</option><option>flip</option></select>
    <label for="dl">Time per letter <span id="vdl"></span></label><input id="dl" type="range" min="20" max="1500" value="120">
    <label for="du">Effect length <span id="vdu"></span></label><input id="du" type="range" min="50" max="2000" value="400">

    <h3>3D text <span id="d3status" style="opacity:.6;font-weight:400;text-transform:none;letter-spacing:0"></span></h3>
    <label style="justify-content:flex-start;gap:6px"><input id="d3on" type="checkbox"> Enable real 3D (needs internet)</label>
    <div id="d3Wrap" class="hidden">
      <label for="d3font">3D font</label>
      <select id="d3font">
        <option value="helvetiker_bold" selected>Helvetiker Bold</option>
        <option value="helvetiker">Helvetiker</option>
        <option value="optimer_bold">Optimer Bold</option>
        <option value="gentilis_bold">Gentilis Bold</option>
      </select>
      <div class="row">
        <div><label for="d3depth">Depth <span id="vd3depth"></span></label><input id="d3depth" type="range" min="2" max="80" value="30"></div>
        <div><label for="d3bevel">Bevel <span id="vd3bevel"></span></label><input id="d3bevel" type="range" min="0" max="30" value="6"></div>
      </div>
      <label for="d3tilt">Tilt <span id="vd3tilt"></span></label><input id="d3tilt" type="range" min="0" max="60" value="12">
      <label for="d3spin">Spin</label>
      <select id="d3spin"><option value="0" selected>Off</option><option value="0.5">Slow</option><option value="1.2">Medium</option><option value="2.4">Fast</option></select>
      <label for="d3axis">Spin axis</label>
      <select id="d3axis"><option value="y" selected>Left/right (Y)</option><option value="x">Up/down (X)</option><option value="both">Tumble</option></select>
      <div class="row">
        <div><label for="d3metal">Metal <span id="vd3metal"></span></label><input id="d3metal" type="range" min="0" max="100" value="30"></div>
        <div><label for="d3rough">Matte <span id="vd3rough"></span></label><input id="d3rough" type="range" min="0" max="100" value="45"></div>
      </div>
      <div class="row">
        <div><label for="d3color">Color</label><input id="d3color" type="color" value="#ff7518"></div>
        <div><label for="d3light">Light <span id="vd3light"></span></label><input id="d3light" type="range" min="0" max="360" value="60"></div>
      </div>
      <label style="justify-content:flex-start;gap:6px"><input id="d3usefg" type="checkbox" checked> Use main text color</label>
    </div>

    <h3>Shadow / glow</h3>
    <label for="shm">Mode</label>
    <select id="shm"><option value="none">None</option><option value="shadow">Drop shadow</option><option value="glow" selected>Glow</option></select>
    <div id="shWrap">
      <div class="row">
        <div><label for="shc">Color</label><input id="shc" type="color" value="#7a5cff"></div>
        <div><label for="shb">Blur <span id="vshb"></span></label><input id="shb" type="range" min="0" max="60" value="18"></div>
      </div>
      <div class="row" id="shoff">
        <div><label for="shx">Offset X <span id="vshx"></span></label><input id="shx" type="range" min="-30" max="30" value="0"></div>
        <div><label for="shy">Offset Y <span id="vshy"></span></label><input id="shy" type="range" min="-30" max="30" value="0"></div>
      </div>
      <label for="shs">Strength <span id="vshs"></span></label><input id="shs" type="range" min="1" max="4" value="2">
      <label for="sha">Animate glow</label>
      <select id="sha"><option value="off">Off (static)</option><option value="pulse" selected>Pulse</option><option value="flicker">Flicker</option><option value="rainbow">Rainbow cycle</option></select>
      <label for="shr" id="shrw">Pulse speed <span id="vshr"></span></label><input id="shr" type="range" min="200" max="3000" value="1200">
    </div>

    <h3>Background</h3>
    <label for="bgt">Type</label>
    <select id="bgt"><option value="solid">Solid</option><option value="linear" selected>Linear</option><option value="radial">Radial</option></select>
    <div class="row">
      <div><label for="c1">Color 1</label><input id="c1" type="color" value="#120a2e"></div>
      <div id="c2w"><label for="c2">Color 2</label><input id="c2" type="color" value="#2a0a3a"></div>
    </div>
    <div id="angw"><label for="ang">Angle <span id="vang"></span></label><input id="ang" type="range" min="0" max="360" value="135"></div>

    <h3>Playback</h3>
    <label style="justify-content:flex-start;gap:6px"><input id="lp" type="checkbox" checked> Loop</label>
    <label for="hd">Hold at end <span id="vhd"></span></label><input id="hd" type="range" min="0" max="8000" step="100" value="1500">
    <div class="btns">
      <button id="play" class="primary">Replay</button>
      <button id="pause" aria-pressed="false">Pause</button>
    </div>
    <div class="btns">
      <button id="saveProj">Save project</button>
      <button id="loadProj">Load project</button>
    </div>
    <button id="saveHtml">Save this page (.html)</button>
    <input id="projFile" type="file" accept=".ktproj,application/json,.json" class="hidden">
  </aside>

  <div class="stageWrap">
    <div id="stage"><div id="txt" role="img"></div></div>

    <h3 style="margin:0">Export GIF (for tiny displays)</h3>
    <div class="dimPrevWrap">
      <div class="dimPrevLabel">Preview at target size <span id="dimInfo"></span></div>
      <div id="dimFrame"><canvas id="dimCanvas"></canvas></div>
      <div class="zoomRow">
        <span>Zoom</span><input id="gzoom" type="range" min="1" max="24" value="6">
        <span id="vzoom"></span>
      </div>
    </div>
    <label for="gpreset">Display preset</label>
    <select id="gpreset">
      <option value="custom">Custom...</option>
      <optgroup label="Curtain / string lights">
        <option value="200x20">Curtain 200x20</option>
        <option value="100x20">Curtain 100x20</option>
        <option value="96x8">Light strip 96x8</option>
        <option value="64x16">Curtain 64x16</option>
        <option value="50x10">Fairy 50x10</option>
      </optgroup>
      <optgroup label="LED matrix panels">
        <option value="30x32" selected>Matrix 30x32</option>
        <option value="8x8">Matrix 8x8</option>
        <option value="16x16">Matrix 16x16</option>
        <option value="32x8">Matrix 32x8</option>
        <option value="32x16">Matrix 32x16</option>
        <option value="64x32">Matrix 64x32</option>
        <option value="128x32">Matrix 128x32</option>
        <option value="128x64">Matrix 128x64</option>
      </optgroup>
      <optgroup label="Square / round">
        <option value="48x48">Small 48x48</option>
        <option value="240x240">Round LCD 240x240</option>
      </optgroup>
    </select>
    <div class="row3">
      <div><label for="gw">Width px</label><input id="gw" type="number" min="4" max="512" value="30"></div>
      <div><label for="gh">Height px</label><input id="gh" type="number" min="4" max="512" value="32"></div>
      <div><label for="gfps">FPS</label><input id="gfps" type="number" min="2" max="30" value="30"></div>
    </div>
    <label for="gquality">Quality</label>
    <select id="gquality">
      <option value="high" selected>High (smooth gradients)</option>
      <option value="low">Low (fast, fixed palette)</option>
    </select>
    <div class="row">
      <label style="justify-content:flex-start;gap:6px"><input id="gfit" type="checkbox" checked> Fit text to frame</label>
      <label style="justify-content:flex-start;gap:6px"><input id="gdith" type="checkbox"> Dither</label>
    </div>
    <div class="btns">
      <button id="renderGif" class="primary">Render GIF</button>
      <button id="dlGif" disabled>Download GIF</button>
    </div>
    <div class="bar"><div id="gbar"></div></div>
    <div class="out" id="out">Pick a preset or type a size. The preview above shows the exact framing. Then Render GIF. The GIF plays the full sequence once and loops forever.</div>
    <img id="gifPrev" alt="" style="image-rendering:pixelated; max-width:100%; border-radius:6px; display:none; background:#000">
  </div>
</div>

<script id="gifenc">
/* Minimal self-contained animated-GIF encoder (no deps, no network).
   NeuQuant-free: builds a palette by uniform 3-3-2 quantization + optional
   ordered dither, LZW-compresses each frame, writes GIF89a with loop ext. */
(function(global){
  function lzwEncode(width,height,pixels,colorDepth){
    var minCode=Math.max(2,colorDepth), out=[], cur=0, curBits=0;
    function put(c){ cur|=c<<curBits; curBits+=codeSize;
      while(curBits>=8){ out.push(cur&255); cur>>=8; curBits-=8; } }
    var clear=1<<minCode, eoi=clear+1, codeSize=minCode+1, dict={}, next;
    function reset(){ dict={}; for(var i=0;i<clear;i++)dict[String.fromCharCode(i)]=i; next=eoi+1; codeSize=minCode+1; }
    reset(); put(clear);
    var prefix=String.fromCharCode(pixels[0]);
    for(var i=1;i<pixels.length;i++){
      var k=String.fromCharCode(pixels[i]), pk=prefix+k;
      if(dict[pk]!==undefined){ prefix=pk; }
      else{ put(dict[prefix]); if(next<4096){ dict[pk]=next++; if(next>(1<<codeSize)&&codeSize<12)codeSize++; } else { put(clear); reset(); } prefix=k; }
    }
    put(dict[prefix]); put(eoi);
    if(curBits>0) out.push(cur&255);
    return out;
  }
  // ---- median-cut adaptive palette (HIGH quality): builds up to 256 colors
  //      that match the actual frames, killing gradient banding. ----
  function medianCut(samples, maxColors){
    // samples: flat [r,g,b, r,g,b, ...]
    function box(idxs){
      var rmin=255,rmax=0,gmin=255,gmax=0,bmin=255,bmax=0;
      for(var k=0;k<idxs.length;k++){ var o=idxs[k]*3, r=samples[o],g=samples[o+1],b=samples[o+2];
        if(r<rmin)rmin=r; if(r>rmax)rmax=r; if(g<gmin)gmin=g; if(g>gmax)gmax=g; if(b<bmin)bmin=b; if(b>bmax)bmax=b; }
      return {idxs:idxs, r:[rmin,rmax], g:[gmin,gmax], b:[bmin,bmax], range:Math.max(rmax-rmin,gmax-gmin,bmax-bmin)};
    }
    var all=[]; for(var i=0;i<samples.length/3;i++) all.push(i);
    var boxes=[box(all)];
    while(boxes.length<maxColors){
      // split the box with the largest range
      var bi=-1, br=-1; for(var j=0;j<boxes.length;j++){ if(boxes[j].idxs.length>1 && boxes[j].range>br){br=boxes[j].range;bi=j;} }
      if(bi<0) break;
      var bx=boxes[bi];
      var ch = (bx.r[1]-bx.r[0]>=bx.g[1]-bx.g[0] && bx.r[1]-bx.r[0]>=bx.b[1]-bx.b[0]) ? 0 : (bx.g[1]-bx.g[0]>=bx.b[1]-bx.b[0]?1:2);
      bx.idxs.sort(function(a,c){ return samples[a*3+ch]-samples[c*3+ch]; });
      var mid=bx.idxs.length>>1;
      boxes.splice(bi,1, box(bx.idxs.slice(0,mid)), box(bx.idxs.slice(mid)));
    }
    return boxes.map(function(bx){
      var r=0,g=0,b=0,n=bx.idxs.length; for(var k=0;k<n;k++){var o=bx.idxs[k]*3; r+=samples[o]; g+=samples[o+1]; b+=samples[o+2];}
      return [Math.round(r/n),Math.round(g/n),Math.round(b/n)];
    });
  }
  function buildAdaptivePalette(frames){
    // sample pixels across all frames (cap total samples for speed)
    var cap=20000, total=0; frames.forEach(function(f){total+=f.data.length/4;});
    var step=Math.max(1, Math.floor(total/cap));
    var samp=[], c=0;
    frames.forEach(function(f){ var d=f.data; for(var p=0;p<d.length;p+=4){ if((c++%step)===0){ samp.push(d[p],d[p+1],d[p+2]); } } });
    var pal=medianCut(samp, 256);
    while(pal.length<256) pal.push([0,0,0]);
    return pal;
  }
  // nearest palette index (linear scan of 256 — fine for tiny frames)
  function nearestIdx(pal, r,g,b){
    var best=0, bd=1e9;
    for(var i=0;i<pal.length;i++){ var c=pal[i]; var dr=r-c[0],dg=g-c[1],db=b-c[2]; var dd=dr*dr+dg*dg+db*db; if(dd<bd){bd=dd;best=i; if(dd===0)break;} }
    return best;
  }
  function quantize(frames,dither,quality){
    var bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    if(quality==='high'){
      var pal=buildAdaptivePalette(frames), cache={};
      var indexed=frames.map(function(fr){
        var d=fr.data, w=fr.w, out=new Uint8Array(w*fr.h);
        for(var p=0,px=0;p<d.length;p+=4,px++){
          var r=d[p],g=d[p+1],b=d[p+2];
          if(dither){ var x=px%w,y=(px/w)|0,t=(bayer[y&3][x&3]-7.5)*3; r=Math.max(0,Math.min(255,r+t)); g=Math.max(0,Math.min(255,g+t)); b=Math.max(0,Math.min(255,b+t)); }
          var key=(r>>2<<12)|(g>>2<<6)|(b>>2);
          var v=cache[key]; if(v===undefined){ v=cache[key]=nearestIdx(pal,r,g,b); }
          out[px]=v;
        }
        return out;
      });
      return {pal:pal, frames:indexed};
    }
    // LOW: fixed 6x6x6 cube + 40 grays
    var pal=[], i;
    for(var r=0;r<6;r++)for(var g=0;g<6;g++)for(var b=0;b<6;b++) pal.push([Math.round(r*51),Math.round(g*51),Math.round(b*51)]);
    for(i=0;i<40;i++){ var v2=Math.round(i*255/39); pal.push([v2,v2,v2]); }
    function idx(r,g,b){ var ri=Math.min(5,Math.round(r/51)),gi=Math.min(5,Math.round(g/51)),bi=Math.min(5,Math.round(b/51)); return ri*36+gi*6+bi; }
    var indexed=frames.map(function(fr){
      var d=fr.data, w=fr.w, out=new Uint8Array(w*fr.h);
      for(var p=0,px=0;p<d.length;p+=4,px++){

<script type="module" id="text3d">
// Real 3D text via three.js TextGeometry (loaded from CDN; needs network).
// Exposes window.Text3D once the font has loaded. 2D mode never touches this.
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const FONTS = {
  'helvetiker_bold':   'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  'helvetiker':        'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json',
  'optimer_bold':      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/optimer_bold.typeface.json',
  'gentilis_bold':     'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/gentilis_bold.typeface.json',
};

let renderer, scene, cam, dir, mesh, ready = false, lastSize = '';
const fonts = {};              // name -> Font
const geoCache = {};           // text|font|depth|bevel -> geometry
const matCache = {};
let loadingFont = null, currentFontName = 'helvetiker_bold';

function initRenderer() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  scene = new THREE.Scene();
  cam = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
  dir = new THREE.DirectionalLight(0xffffff, 1.25); scene.add(dir);
  scene.add(new THREE.AmbientLight(0xffffff, 0.2));
}

async function loadFont(name) {
  if (fonts[name]) { currentFontName = name; return fonts[name]; }
  const url = FONTS[name] || FONTS['helvetiker_bold'];
  const f = await new FontLoader().loadAsync(url);
  fonts[name] = f; currentFontName = name; ready = true;
  return f;
}

function mat(colorHex, metal, rough) {
  const k = colorHex + metal + rough;
  if (matCache[k]) return matCache[k];
  const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(colorHex), metalness: metal, roughness: rough });
  matCache[k] = m; return m;
}

function buildGeo(str, fontName, depth, bevel) {
  const key = str + '|' + fontName + '|' + depth + '|' + bevel;
  if (geoCache[key]) return geoCache[key];
  const font = fonts[fontName] || fonts[currentFontName];
  const geo = new TextGeometry(str, {
    font, size: 1, height: depth, curveSegments: 5,
    bevelEnabled: bevel > 0, bevelThickness: bevel * 0.6, bevelSize: bevel, bevelSegments: 3,
  });
  geo.center();
  geoCache[key] = geo; return geo;
}

// ---- baked logo shapes (traced contours), extruded like real 3D letters ----
const LOGOS = window.__KT_LOGOS || {};
const shapeGeoCache = {};
function buildShapeGeo(key, depth, bevel) {
  const ck = key + '|' + depth + '|' + bevel;
  if (shapeGeoCache[ck]) return shapeGeoCache[ck];
  const L = LOGOS[key]; if (!L) return null;
  const sc = 4 / L.H, nx = x => (x - L.W/2)*sc, ny = y => (L.H/2 - y)*sc;
  const shapes = L.shells.map(s => {
    const shp = new THREE.Shape();
    s.outer.forEach(([x,y],i)=> i?shp.lineTo(nx(x),ny(y)):shp.moveTo(nx(x),ny(y))); shp.closePath();
    (s.holes||[]).forEach(hh=>{ const ph=new THREE.Path(); hh.forEach(([x,y],i)=>i?ph.lineTo(nx(x),ny(y)):ph.moveTo(nx(x),ny(y))); ph.closePath(); shp.holes.push(ph); });
    return shp;
  });
  const geo = new THREE.ExtrudeGeometry(shapes, { depth, bevelEnabled: bevel>0, bevelThickness: bevel*0.8, bevelSize: bevel, bevelSegments: 3, steps:1, curveSegments:2 });
  geo.center();
  shapeGeoCache[ck] = geo; return geo;
}
// draw an extruded baked logo. cfg same shape as text cfg; color falls back to logo color.
function drawShapeInto(ctx, w, h, logoKey, phase, cfg) {
  if (typeof THREE === 'undefined' || !THREE.ExtrudeGeometry) return false;
  initRenderer(); ready = true;
  const sizeKey = w + 'x' + h + 's';
  if (sizeKey !== lastSize) { renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); lastSize = sizeKey; }
  const geo = buildShapeGeo(logoKey, cfg.depth, cfg.bevel); if (!geo) return false;

  geo.computeBoundingBox(); const bb = geo.boundingBox;
  const bw = (bb.max.x-bb.min.x)||1, bh=(bb.max.y-bb.min.y)||1, fov=cam.fov*Math.PI/180;
  const dW=(bw*1.15/2)/Math.tan(fov/2)/cam.aspect, dH=(bh*1.2/2)/Math.tan(fov/2);

// cfg: { fontName, depth, tilt, spin, spinAxis, metal, rough, color, lightAngle, bevel }
function drawInto(ctx, w, h, text, visible, phase, cfg) {
  if (!ready || !fonts[cfg.fontName || currentFontName]) return false;

  if (sizeKey !== lastSize) { renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); lastSize = sizeKey; }

  const chars = Array.from(text);
  const shownStr = chars.slice(0, Math.max(0, Math.min(visible, chars.length))).join('').replace(/\s+$/, '');
  if (mesh) { scene.remove(mesh); mesh = null; }
  renderer.setClearColor(0x000000, 0);
  if (!shownStr.trim()) { renderer.clear(); ctx.drawImage(renderer.domElement, 0, 0, w, h); return true; }

  let geo;
  try { geo = buildGeo(shownStr, cfg.fontName || currentFontName, cfg.depth, cfg.bevel); } catch (e) { return false; }
  mesh = new THREE.Mesh(geo, mat(cfg.color, cfg.metal, cfg.rough));
  let ry = cfg.tilt, rx = cfg.tilt * 0.35;
  if (cfg.spin > 0) { const a = phase * cfg.spin; if (cfg.spinAxis === 'y') ry += a; else if (cfg.spinAxis === 'x') rx += a; else { ry += a; rx += a * 0.5; } }
  mesh.rotation.y = ry; mesh.rotation.x = rx; scene.add(mesh);

  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const bw = (bb.max.x - bb.min.x) || 1, bh = (bb.max.y - bb.min.y) || 1;
  const fov = cam.fov * Math.PI / 180;
  const distW = (bw * 1.15 / 2) / Math.tan(fov / 2) / cam.aspect;
  const distH = (bh * 1.2 / 2) / Math.tan(fov / 2);
  cam.position.set(0, 0, Math.max(distW, distH, 2) + cfg.depth + cfg.bevel * 2);
  cam.lookAt(0, 0, 0);
  const la = cfg.lightAngle * Math.PI / 180;
  dir.position.set(Math.cos(la) * 5, 4, Math.sin(la) * 5 + 4);

  renderer.render(scene, cam);
  ctx.drawImage(renderer.domElement, 0, 0, w, h);
  return true;
}

// public API
window.Text3D = {
  drawInto,
  available: () => ready,
  ensureFont: (name) => {
    const target = name || currentFontName;
    if (fonts[target]) { currentFontName = target; return Promise.resolve(fonts[target]); }
    loadingFont = loadFont(target).catch(e => { console.warn('font load failed', e); return null; });

  },
  fonts: FONTS,
  drawShapeInto,                 // extrude a baked logo
  logos: LOGOS,                  // registry of baked logo shapes
  shapeReady: () => (typeof THREE !== 'undefined' && !!THREE.ExtrudeGeometry),
};
// kick off the default font load immediately
window.Text3D.ensureFont('helvetiker_bold');

      if (m !== 'none') {
        let col = E.shc.value, blur = Math.max(1, n('shb') * (h/120));
        if (E.sha.value==='pulse') { const k=0.5+0.5*Math.sin(phase); blur*=(0.4+0.9*k); }
        else if (E.sha.value==='rainbow') col = `hsl(${(phase*57.3)%360},100%,65%)`;
        ctx.shadowColor = col; ctx.shadowBlur = blur + (et2&&et2.blur?et2.blur:0);
        ctx.shadowOffsetX = m==='shadow'? n('shx')*(h/120):0;
        ctx.shadowOffsetY = m==='shadow'? n('shy')*(h/120):0;
      } else { ctx.shadowBlur = 0; }
      if (sw>0){ ctx.lineWidth = sw*(h/100); ctx.strokeStyle = E.stc.value; ctx.lineJoin='round'; ctx.miterLimit=2; ctx.strokeText(str,0,0); }
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      ctx.fillStyle = E.fg.value;
      const passes = (m==='glow' && sw===0) ? Math.round(n('shs')) : 1;
      for (let i=0;i<passes;i++) ctx.fillText(str, 0, 0);
    }

    if (single) {
      // one glyph, animate its entrance
      ctx.save();
      ctx.translate(w/2, h/2);
      if (et) {
        ctx.globalAlpha = et.alpha;
        ctx.translate(et.dx, et.dy);
        if (et.rot) ctx.rotate(et.rot);
        const sx = et.flip!=null ? 1 : et.scale, sy = et.flip!=null ? Math.max(0.02, Math.cos(et.flip*Math.PI/2)) : et.scale;
        ctx.scale(sx, sy);
      }
      paintGlyph(shown, et);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else {
      // build mode: draw settled prefix, then the newest glyph animating in at its slot
      const settled = chars.slice(0, Math.max(0, visibleCount-1)).join('');
      const full = chars.slice(0, visibleCount).join('');
      if (!et) { ctx.save(); ctx.translate(w/2,h/2); paintGlyph(full, null); ctx.restore(); }
      else {
        // measure positions so the new glyph lands in place while older ones stay put
        const fullW = ctx.measureText(full).width, settledW = ctx.measureText(settled).width;
        const originX = w/2 - fullW/2;         // left edge of full string (centered)
        ctx.save(); ctx.textAlign='left'; ctx.translate(originX, h/2);
        paintGlyph(settled, null);             // older letters, settled
        const ng = chars[visibleCount-1]===' ' ? '' : chars[visibleCount-1];
        ctx.save();
        ctx.translate(settledW, 0);
        ctx.globalAlpha = et.alpha; ctx.translate(et.dx, et.dy); if (et.rot) ctx.rotate(et.rot);
        const sy = et.flip!=null ? Math.max(0.02, Math.cos(et.flip*Math.PI/2)) : et.scale;
        ctx.scale(et.flip!=null?1:et.scale, sy);
        paintGlyph(ng, et);
        ctx.restore(); ctx.restore(); ctx.globalAlpha = 1;
      }
    }
  }

  // TWO-AT-A-TIME SLIDE (continuous): a letter splashes in on the right, then
  // slides LEFT at a steady rate from the instant it lands, staying visible the
  // whole way until it exits the left edge. Several letters are on screen at once.
  // localMs = elapsed ms into this text step.
  function drawSlideFrame(ctx, w, h, s, localMs, phase) {
    const chars = Array.from(s.text);
    const fam = E.font.value==='custom' ? (E.fontC.value||'system-ui') : E.font.value;
    const reduce = rm.matches;
    const measureStr = widestChar(chars, fam);
    // BIGGER letters: fill the height; allow a wider glyph (up to ~58% width) so
    // Impact's wide caps aren't shrunk so much. Two still barely fit via tight pitch.
    let px = Math.round(h * 0.98);
    if ($('gfit').checked) {
      for (; px > 4; px--) { ctx.font = `${E.wt.value} ${px}px ${fam}`; if (ctx.measureText(measureStr).width <= w*0.58 && px <= h*0.98) break; }
    }
    ctx.font = `${E.wt.value} ${px}px ${fam}`;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    const m = E.shm.value;
    const yC = h/2;
    const dl = n('dl'), du = Math.min(dl, n('du'));
    const splashMs = Math.min(du, dl*0.45);   // how long the twist-pop takes
    // LESS kerning: pitch barely bigger than a glyph, so two just fit.
    const glyphW = Math.max(px*0.5, ctx.measureText(widestChar(chars,fam)).width);
    const pitch = glyphW * 0.92;              // tight: letters nearly touch, two barely fit
    const speed = pitch / dl;                 // px/ms, one pitch per window
    const xGone = -glyphW*0.7;                 // fully off the left edge
    // The letter keeps scrolling during its splash, so to have it SETTLE on the
    // right half exactly when the pop finishes, start it further right by the
    // distance it drifts during the splash.
    const xSettle = w*0.70;                    // right-half anchor at end of pop
    const xLand = xSettle + speed*splashMs;    // age-0 start, so x(splashMs)=xSettle

    function paint(str, x, sc, rot, alpha, bright, dy) {
      if (!str) return;
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.translate(x, yC + (dy||0)); if (rot) ctx.rotate(rot); ctx.scale(sc, sc);
      if (m !== 'none') {
        let col = E.shc.value, blur = Math.max(1, n('shb')*(h/120));
        if (E.sha.value==='pulse'){ const k=0.5+0.5*Math.sin(phase); blur*=(0.4+0.9*k); }
        else if (E.sha.value==='rainbow') col=`hsl(${(phase*57.3)%360},100%,65%)`;
        ctx.shadowColor=col; ctx.shadowBlur=blur; ctx.shadowOffsetX=m==='shadow'?n('shx')*(h/120):0; ctx.shadowOffsetY=m==='shadow'?n('shy')*(h/120):0;
      } else ctx.shadowBlur=0;
      ctx.fillStyle = bright>0 ? mixHex(E.fg.value, '#ffffff', bright) : E.fg.value;
      const passes = m==='glow' ? Math.round(n('shs')) : 1;
      for (let i=0;i<passes;i++) ctx.fillText(str, 0, 0);
      ctx.shadowBlur=0;
      const sw = n('stw'); if (sw>0){ ctx.lineWidth = sw*(h/200); ctx.strokeStyle = E.stc.value; ctx.lineJoin='round'; ctx.miterLimit=2; ctx.strokeText(str,0,0); }
      ctx.restore();
    }

    // Draw oldest first so the newest (bright) paints on top during overlap.
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i]; if (ch === ' ' || ch == null) continue;
      const age = localMs - i*dl;              // ms since this letter landed
      if (age < 0) continue;                    // not arrived yet
      const x = xLand - speed*age;              // steady scroll, one pitch per window
      if (x < xGone) continue;                   // slid off the left edge
      if (!reduce && age < splashMs) {
        const q = age / splashMs;
        const et = enterTransform('splash', q, px);
        const sc = Math.max(0.35, et.scale);    // floor so it's readable immediately
        const al = Math.max(0.5, et.alpha);
        const bright = Math.max(0, 0.85*(1 - q*1.3));
        paint(ch, x + et.dx, sc, et.rot, al, bright, et.dy);
      } else {
        paint(ch, x, 1, 0, 1, 0, 0);
      }
    }
  }
  // blend two #rrggbb by t (0..1)
  function mixHex(a, b, t) {
    const pa=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16));
    const pb=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
    const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
    return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  // draw an already-loaded image with per-step brightness + tint, fit by height%
  const _tintCv = document.createElement('canvas');
  function blitImage(ctx, w, h, img, s) {
    const scale = (h*(s.h||70)/100) / img.height;
    const dw = Math.max(1,Math.round(img.width*scale)), dh = Math.max(1,Math.round(img.height*scale));
    const bright = (s.bright!=null?s.bright:100)/100;
    const tintAmt = (s.tintAmt||0)/100;
    const x=(w-dw)/2, y=(h-dh)/2;
    if (bright===1 && tintAmt===0) { ctx.drawImage(img, x, y, dw, dh); return; }
    // render to a temp canvas so tint only hits the image's own pixels (source-atop)
    _tintCv.width=dw; _tintCv.height=dh; const tc=_tintCv.getContext('2d');
    tc.clearRect(0,0,dw,dh);
    tc.filter = bright!==1 ? `brightness(${bright})` : 'none';
    tc.drawImage(img, 0, 0, dw, dh);
    tc.filter='none';
    if (tintAmt>0 && s.tint) { tc.globalCompositeOperation='source-atop'; tc.globalAlpha=tintAmt; tc.fillStyle=s.tint; tc.fillRect(0,0,dw,dh); tc.globalAlpha=1; tc.globalCompositeOperation='source-over'; }
    ctx.drawImage(_tintCv, x, y, dw, dh);
  }
  async function drawImageFrame(ctx, w, h, s) {
    const img = await loadImg(s.src);
    blitImage(ctx, w, h, img, s);
  }

  // Draw the right frame of an uploaded GIF clip at localMs, scaled to the frame.
  function drawGifFrame(ctx, w, h, s, localMs) {
    const clip = gifClips[s.clip]; if (!clip || !clip.frames.length) return;
    // pick frame by walking the per-frame delays (loop within the clip duration)
    let t = clip.dur>0 ? (localMs % clip.dur) : 0, idx = 0;
    for (let i=0;i<clip.delays.length;i++){ if (t < clip.delays[i]) { idx=i; break; } t -= clip.delays[i]; idx=i; }
    const bmp = clip.frames[idx]; if (!bmp) return;
    // fit
    const sw = clip.w, sh = clip.h;
    let dw, dh;
    if (s.fit === 'stretch') { dw=w; dh=h; }
    else { const sc = (s.fit==='cover') ? Math.max(w/sw, h/sh) : Math.min(w/sw, h/sh); dw=sw*sc; dh=sh*sc; }
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = (s.scale !== 'nearest');
    if (ctx.imageSmoothingEnabled) ctx.imageSmoothingQuality = 'high';
    // cover crops to frame; contain/stretch centered
    ctx.save();
    if (s.fit === 'cover') { ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip(); }
    ctx.drawImage(bmp, (w-dw)/2, (h-dh)/2, dw, dh);
    ctx.restore();
    ctx.imageSmoothingEnabled = prev;
  }
  const imgCache = {};   // src -> Promise<Image>
  const imgReady = {};    // src -> Image (once loaded), used by the sync preview
  function loadImg(src){
    return imgCache[src] || (imgCache[src] = new Promise((res,rej)=>{
      const i=new Image(); i.onload=()=>{ imgReady[src]=i; res(i); }; i.onerror=rej; i.src=src;
    }));
  }

  // Draw a built-in logo. 3D mode -> extrude via three.js; else flat fill its path.
  // A logo keeps its OWN baked color (e.g. maroon) unless the step overrides it.
  const _p2d = {};
  function drawLogoFrame(ctx, w, h, s, tSec, enterP) {
    const L = logoDef(s.key); if (!L) return;
    let col = s.color || L.hex || '#ffffff';
    // brightness: mix toward white (>100%) or black (<100%)
    const br = (s.bright!=null?s.bright:100)/100;
    if (br > 1) col = mixHex(col, '#ffffff', Math.min(1,(br-1)));
    else if (br < 1) col = mixHex(col, '#000000', 1-br);
    // splash entrance for the logo (drop + pop-overshoot + twist), then settle
    const et = (enterP != null && enterP < 1 && !rm.matches) ? enterTransform('splash', enterP, h*0.5) : null;
    if (is3D() && window.Text3D.shapeReady && window.Text3D.shapeReady()) {
      const cfg = d3cfg(); cfg.color = col;
      window.Text3D.drawShapeInto(ctx, w, h, s.key, tSec, cfg);
      return;
    }
    // 2D flat: fill the traced path, scaled to fit (s.h % of frame height), centered.
    // Leave pop headroom so the overshoot isn't clipped.
    if (!_p2d[s.key]) _p2d[s.key] = new Path2D(L.svgPath);
    const room = et ? 0.72 : (s.h||80)/100;
    const targetH = h * room;
    const baseScale = targetH / L.H;
    ctx.save();
    ctx.translate(w/2, h/2);
    if (et) {
      ctx.globalAlpha = et.alpha;
      ctx.translate(et.dx, et.dy);
      if (et.rot) ctx.rotate(et.rot);
      ctx.scale(et.scale, et.scale);
    }
    ctx.scale(baseScale, baseScale);
    ctx.translate(-L.W/2, -L.H/2);
    ctx.fillStyle = col;
    ctx.fill(_p2d[s.key], 'evenodd');
    if (s.stroke>0) { ctx.lineWidth = (s.stroke*(h/100)) / baseScale; ctx.strokeStyle = s.strokeColor||'#000'; ctx.lineJoin='round'; ctx.stroke(_p2d[s.key]); }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  async function renderGif() {
    const w = Math.max(4, Math.min(512, parseInt($('gw').value)||64));
    const h = Math.max(4, Math.min(512, parseInt($('gh').value)||16));
    const fps = Math.max(2, Math.min(30, parseInt($('gfps').value)||12));
    const dtMs = 1000/fps, delayCs = Math.max(2, Math.round(100/fps));
    const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
    const ctx = cv.getContext('2d', { willReadFrequently:true });
    const out = $('out'); $('renderGif').disabled=true; $('dlGif').disabled=true;
    out.textContent = 'Rendering frames...';
    const frames = [];

    // Build a flat timeline (ms) of what to draw.
    // Each text step: letters appear every dl ms, then hold. Image step: hold.
    let phase = 0, elapsedMs = 0;
    const use3D = is3D(), cfg3 = use3D ? d3cfg() : null, single = E.mode.value==='single';
    for (const s of seq) {
      if (s.type === 'gif') {
        const clip = gifClips[s.clip];
        const dur = (s.loopHold ? s.hold : (clip?clip.dur:s.hold));
        const nf = Math.max(1, Math.round(dur/dtMs));
        for (let f=0; f<nf; f++) {
          bgPaint(ctx,w,h); drawGifFrame(ctx,w,h,s,f*dtMs);
          frames.push(grab(ctx,w,h)); elapsedMs += dtMs;
          $('gbar').style.width = Math.round(100*frames.length/(frames.length+nf-f)) + '%';
        }
      } else if (s.type === 'image') {
        const dur = s.hold, nf = Math.max(1, Math.round(dur/dtMs));
        for (let f=0; f<nf; f++) {
          bgPaint(ctx,w,h); await drawImageFrame(ctx,w,h,s);
          frames.push(grab(ctx,w,h)); elapsedMs += dtMs;
        }
      } else if (s.type === 'logo') {
        const dur = s.hold, nf = Math.max(1, Math.round(dur/dtMs));
        const enterMs = Math.min(n('du')*1.4, dur*0.5);
        for (let f=0; f<nf; f++) {
          const lms = f*dtMs;
          const lp = enterMs>0 ? Math.min(1, lms/enterMs) : 1;
          bgPaint(ctx,w,h); drawLogoFrame(ctx,w,h,s,elapsedMs/1000,lp);
          frames.push(grab(ctx,w,h)); elapsedMs += dtMs;
          $('gbar').style.width = Math.round(100*frames.length/(frames.length+nf-f)) + '%';
        }
      } else {
        const chars = Array.from(s.text);
        const slide = E.mode.value === 'slide';
        const revealMs = (chars.length + (slide?2.4:0)) * n('dl');
        const total = revealMs + s.hold;
        const nf = Math.max(1, Math.round(total/dtMs));
        for (let f=0; f<nf; f++) {
          const tms = f*dtMs;
          const visible = tms < revealMs ? Math.min(chars.length, Math.floor(tms/n('dl'))+1) : chars.length;
          const intoLetter = tms - (visible-1)*n('dl');
          const enterP = tms < revealMs ? Math.min(1, intoLetter / Math.max(1, Math.min(n('dl'), n('du')))) : 1;
          phase += (2*Math.PI) * (dtMs/1000) / (n('shr')/1000);
          bgPaint(ctx,w,h);
          if (use3D) {
            const str = single ? (visible>0 ? (chars[visible-1]===' '?'':chars[visible-1]) : '') : chars.slice(0,visible).join('');
            window.Text3D.drawInto(ctx,w,h,str,str.length,elapsedMs/1000,cfg3);
          } else if (slide) {
            drawSlideFrame(ctx,w,h,s,tms,phase);
          } else {
            drawTextFrame(ctx,w,h,s,visible,phase,enterP);
          }
          frames.push(grab(ctx,w,h)); elapsedMs += dtMs;
          $('gbar').style.width = Math.round(100*frames.length/ (frames.length+nf-f)) + '%';
        }
      }
    }
    frames.dither = $('gdith').checked;
    frames.quality = $('gquality').value;
    out.textContent = `Encoding ${frames.length} frames at ${w}x${h}...`;
    await new Promise(r=>setTimeout(r,30));
    gifBytes = GifMaker.encode(frames, delayCs);
    const blob = new Blob([gifBytes], {type:'image/gif'});
    const url = URL.createObjectURL(blob);
    const prev = $('gifPrev'); prev.src = url; prev.style.display='block';
    prev.style.width = Math.min(w*4, 300)+'px';
    $('dlGif').disabled = false;
    $('dlGif').onclick = () => { const a=document.createElement('a'); a.href=url; a.download=`kinetic-${w}x${h}.gif`; a.click(); };
    out.textContent = `Done. ${w}x${h}, ${frames.length} frames, ${(gifBytes.length/1024).toFixed(1)} KB. Loops forever.`;
    $('gbar').style.width='100%'; $('renderGif').disabled=false;
  }
  function grab(ctx,w,h){ const d=ctx.getImageData(0,0,w,h); return {data:d.data, w, h}; }

  $('renderGif').onclick = () => renderGif().catch(e=>{ $('out').textContent='Error: '+e.message; $('renderGif').disabled=false; });

  // ---- save standalone page ----
  $('saveHtml').onclick = () => {
    simple.forEach(i => { const e=E[i];
      if (e.type==='checkbox') e.toggleAttribute('checked', e.checked);
      else if (e.tagName==='SELECT') [...e.options].forEach(o=>o.toggleAttribute('selected', o.value===e.value));
      else e.setAttribute('value', e.value);
    });
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML
      .replace(/<script id="seqdata">[\s\S]*?<\/script>/,'')
      .replace('</head>', `<script id="seqdata">window.__SEQ=${JSON.stringify(seq).replace(/</g,'\\u003c')};<\/script></head>`);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='kinetic-text.html'; a.click();
  };

  // ---- save / load project (.ktproj = JSON with settings + sequence + clip bytes) ----
  $('saveProj').onclick = () => {
    const settings = {}; simple.forEach(i => { const e=E[i]; settings[i] = (e.type==='checkbox') ? e.checked : e.value; });
    // only include gif clips actually referenced by the sequence
    const clips = {};
    seq.forEach(s => { if (s.type==='gif' && gifClips[s.clip] && gifClips[s.clip].b64) clips[s.clip] = { b64: gifClips[s.clip].b64 }; });
    const proj = { kineticText: 1, savedAt: new Date().toISOString(), target: { w:$('gw').value, h:$('gh').value, fps:$('gfps').value }, settings, seq, clips };
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(proj)], {type:'application/json'}));
    a.download='kinetic.ktproj'; a.click();
    $('out').textContent = 'Project saved ('+seq.length+' steps, '+Object.keys(clips).length+' clip(s)).';
  };
  $('loadProj').onclick = () => $('projFile').click();
  $('projFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; e.target.value='';
    try {
      const proj = JSON.parse(await f.text());
      if (!proj || !proj.seq) throw new Error('not a kinetic project file');
      // restore settings
      if (proj.settings) simple.forEach(i => { if (i in proj.settings) { const e2=E[i]; if (e2.type==='checkbox') e2.checked=!!proj.settings[i]; else e2.value=proj.settings[i]; } });
      if (proj.target) { if(proj.target.w)$('gw').value=proj.target.w; if(proj.target.h)$('gh').value=proj.target.h; if(proj.target.fps)$('gfps').value=proj.target.fps; }
      // re-decode gif clips referenced by the sequence
      if (proj.clips && 'ImageDecoder' in window) {
        for (const id of Object.keys(proj.clips)) {
          const b64 = proj.clips[id].b64; if (!b64) continue;
          try { await decodeGifInto(id, b64ToBuf(b64), b64); const num=parseInt(id.replace(/\D/g,''))||0; if(num>gifClipSeq)gifClipSeq=num; } catch(err){ console.warn('clip decode failed', id, err); }
        }
      }
      seq = proj.seq;
      style(); readDims(); sync3D(); renderSteps(); restart();
      $('out').textContent = 'Project loaded: '+seq.length+' steps.';
    } catch(err) { $('out').textContent = 'Load failed: '+err.message; }
  };

  if (window.__SEQ) seq = window.__SEQ;
  renderSteps();
  restart();
})();
</script>
</body>
</html>
